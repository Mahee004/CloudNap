apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello-api-knative
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/target: "1"
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "5"
    spec:
      containers:
        - image: mahee004/hello-api:v1
          ports:
            - containerPort: 8080