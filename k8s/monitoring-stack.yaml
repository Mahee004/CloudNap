apiVersion: v1
kind: Namespace
metadata:
  name: prometheus

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: prometheus

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: prometheus
roleRef:
  kind: ClusterRole
  name: prometheus
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: prometheus

data:
  prometheus.yml: |

    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:

      # Prometheus monitors itself
      - job_name: "prometheus"
        static_configs:
          - targets:
              - "localhost:9090"

      # Monitor Knative service (hello-api-knative)
      - job_name: "hello-api-knative"
        metrics_path: /actuator/prometheus  # Adjust to /actuator/prometheus if using Spring Boot
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - default
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_pod_label_serving_knative_dev_service]
            action: keep
            regex: hello-api-knative
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "8080"
          - source_labels: [__meta_kubernetes_pod_label_serving_knative_dev_service]
            target_label: service_name
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # Monitor HPA deployment (hello-api-hpa)
      - job_name: "hello-api-hpa"
        metrics_path: /actuator/prometheus  # Adjust to /actuator/prometheus if using Spring Boot
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - default
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: hello-api-hpa
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "8080"
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service_name
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: prometheus

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      serviceAccountName: prometheus

      containers:
        - name: prometheus

          image: prom/prometheus:v3.13.2

          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=6h"

          ports:
            - containerPort: 9090

          volumeMounts:
            - name: config
              mountPath: /etc/prometheus

            - name: data
              mountPath: /prometheus

      volumes:

        - name: config
          configMap:
            name: prometheus-config

        - name: data
          emptyDir: {}

---

apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: prometheus

spec:
  selector:
    app: prometheus

  ports:
    - port: 9090
      targetPort: 9090

  type: ClusterIP