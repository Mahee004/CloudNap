apiVersion: apps/v1
kind: Deployment

metadata:
  name: hello-api-hpa
  namespace: default

spec:
  replicas: 1

  selector:
    matchLabels:
      app: hello-api-hpa

  template:
    metadata:
      labels:
        app: hello-api-hpa

    spec:
      containers:
        - name: hello-api
          image: mahee004/hello-api:v2

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"